<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리의 결혼식에 초대합니다</title>

  <style>
    body {
      margin: 0;
      background: #f7f4ee;
      color: #49453f;
      font-family: "AppleMyungjo", "Batang", serif;
    }

    main {
      box-sizing: border-box;
      max-width: 480px;
      min-height: 100svh;
      margin: 0 auto;
      padding: 90px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .label {
      font-size: 12px;
      letter-spacing: 4px;
      color: #756b5d;
    }

    h1 {
      margin: 36px 0;
      font-size: 30px;
      font-weight: normal;
      line-height: 1.8;
    }

    .line {
      width: 36px;
      height: 1px;
      margin: 0 auto 30px;
      background: #b5a58b;
    }

    p {
      font-size: 16px;
      line-height: 2;
    }

    .note {
      margin-top: 60px;
      font-size: 13px;
      color: #756b5d;
    }
  </style>
</head>

<body>
  <main>
    <p class="label">WE ARE GETTING MARRIED</p>

    <h1>우리의 결혼식에<br>초대합니다</h1>

    <div class="line"></div>

    <p>
      서로의 일상에 스며든 두 사람,<br>
      이제 같은 내일을 시작합니다.
    </p>

    <p>신랑 이름 &amp; 신부 이름</p>

    <p class="note">예식 날짜와 장소를 곧 전해드릴게요.</p>
  </main>
</body>
</html>
